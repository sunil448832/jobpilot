  hispanic_latino: "Decline to self-identify"
  veteran_status: "I am not a protected veteran"
  disability_status: "No, I do not have a disability"
  requires_accommodation: false

# Standard yes/no screeners.
screening:
  over_18: true
  can_perform_essential_functions: true
  # Default for companies he has never worked at.
  previously_employed_here: false
  # One answer for every relatives / affiliation / conflict-of-interest question: a relative,
  # spouse or close friend at the company, its customers or partners; a government or public
  # post; ties to officials or candidates, donations, outside employment or business interests.
  relatives_affiliations_or_conflicts: "No"
  # Per-company overrides. autofill.py matches the application's company against
  # these keys before falling back to the defaults above. Answering "no" on an
  # Amazon form would be a false statement — they check it against their records.
  previously_employed_overrides:
    amazon: true
    "amazon web services": true
    aws: true
    "amazon development centre": true
  previously_employed_detail:
    amazon: "Applied Scientist I, Amazon Development Centre (India), Oct 2022 - Jun 2023"
  non_compete_restrictions: false
  agree_to_background_check: true
  agree_to_drug_test: true
  # a form's own acknowledgement box: "I have read and agree", "Check this box to
  # confirm the statement above" (the information given is true, the terms read)
  confirm_form_statements: true
  willing_to_travel: true
  travel_percentage_ok: "up to 25%"
  remote_or_onsite_preference: "Open — onsite, hybrid, or remote"

files:
  # Built by apply.py into the tool's applications/<company>/ (paths relative to
  # jobpilot/); default_fallback_pdf is relative to the resume repo's resume/.
  # Always the same filename — a recruiter sees it, and a company-suffixed
  # name reads as machine-generated. The folder keeps them apart.
  resume_pdf_pattern: "applications/{company}/sunil_resume.pdf"
  resume_docx_pattern: "applications/{company}/sunil_resume.docx"
  # Which one to upload where. The resume PDF's text extracts cleanly (checked 2026-09-29:
  # single column, no broken ligatures), so the resume field gets the PDF — the layout a
  # recruiter should see. A form with a second attachment field (cover letter, additional
  # documents) gets the .docx there too.
  upload_for_ats_portal: "pdf"
  upload_for_human_review: "pdf"
  default_fallback_pdf: "sunil_resume.pdf"

# Portals routed to the phone vs. batched for desktop. See automation-plan.md §1.
portal_routing:
  mobile_ok: ["greenhouse", "lever", "ashby"]
  desktop_only: ["workday", "taleo", "icims", "successfactors"]
