work_authorization:
  citizenship: "India"
  current_work_country: "India"
  # By the country of the job: are you legally authorized to work there WITHOUT sponsorship,
  # and will you require sponsorship now or in the future? India needs none; every other
  # country (US, UK, EU, Switzerland, Gulf, Australia, Canada, ...) needs it.
  india:
    authorized_without_sponsorship: true
    requires_sponsorship: false
  outside_india:
    authorized_without_sponsorship: false
    requires_sponsorship: true
  visa_status_note: >-
    Indian citizen, currently in India. Require employment visa sponsorship to work
    onsite outside India. Available immediately for fully-remote roles, engaged as a
    contractor or through an Employer of Record.
  remote_from_india_note: >-
    For fully-remote roles I work from India as a contractor or via an EOR
    (Deel / Remote.com / Oyster), invoiced in the company's currency.

availability:
  notice_period: "2 months"
  notice_period_days: "60"            # for numeric-only fields
  earliest_start_date: "2 months from offer acceptance"
  # Date pickers need a real date, not a sentence. Refresh if stale.
  earliest_start_iso: "2026-11-04"
  currently_employed: true
  # Sponsorship adds lead time on top of notice. Realistic total start lag:
  #   Netherlands (HSM via recognised sponsor)  ~2 months notice + 3-6 weeks
  #   UAE / Saudi (employment visa)             ~2 months notice + 4-8 weeks
  #   Australia (subclass 482)                  ~2 months notice + 6-12 weeks
  #   USA (H-1B lottery)                        tied to the March lottery / Oct start
  #   Remote contractor / EOR                   ~2 months notice, no visa lag

compensation:
  # NEVER quote INR to a foreign employer — it anchors you to an Indian band.
  # autofill.py picks the block matching the job's country; `default` is the
  # fallback when the country is unknown.
  current_ctc: "Prefer to discuss — targeting the local market rate for the role"
  never_quote_inr: true
  salary_flexible_note: >-
    Open to discussing based on total package and level. Prioritising role scope,
    team, and the sponsorship/remote arrangement over base alone.

  default:
    currency: "USD"
    expected_annual: "200000"
    expected_text: "USD 200,000 base"

  by_market:
    usa:
      currency: "USD"
      expected_annual: "200000"
      expected_text: "USD 200,000 base (open on total comp / equity mix)"
      note: "Base ask. US total comp usually adds equity on top."
    uae:
      currency: "AED"
      expected_monthly: "40000"
      expected_annual: "480000"
      expected_text: "AED 40,000 per month all-inclusive (tax-free)"
      note: "Gulf negotiates monthly at offer. ~USD 131k/yr tax-free."
    saudi:
      currency: "SAR"
      expected_monthly: "41000"
      expected_annual: "492000"
      expected_text: "SAR 41,000 per month all-inclusive (tax-free)"
      note: "Equivalent of the AED 40k/month anchor (~1 AED = 1.02 SAR)."
    australia:
      currency: "AUD"
      expected_annual: "185000"
      expected_text: "AUD 185,000 base plus superannuation"
      note: >-
        ESTIMATE — senior MLE Sydney/Melbourne with 5 yrs sits ~AUD 165-200k base
        + 12% super. 185k is a confident mid-ask. Always say "plus super";
        quoting a package number reads as a lower base.
    netherlands:
      currency: "EUR"
      expected_annual: "95000"
      expected_text: "EUR 95,000 gross per year plus 8% holiday allowance"
      note: >-
        ESTIMATE — senior MLE Amsterdam with 5 yrs sits ~EUR 75-95k gross; the ask is
        set at the top of that band (Sunil, 2026-09-29).
        Clears the Highly Skilled Migrant salary threshold comfortably. Ask about
        the 30% ruling: it was cut back in 2024-25 and becomes a flat 27% in 2027,
        so confirm the current rate rather than assuming 30%.
    ireland:
      currency: "EUR"
      expected_annual: "90000"
      expected_text: "EUR 90,000 gross per year"
      note: >-
        ESTIMATE — senior MLE Dublin with 5 yrs sits ~EUR 80-105k. The US
        companies with EMEA bases there (Stripe, Datadog, HubSpot, Intercom) pay
        at the top of that; Irish-owned firms at the bottom. Far above the EUR
        38,000 Critical Skills permit threshold, so pay is never the visa
        blocker here. Dublin rent is the thing to negotiate against.
    germany:
      currency: "EUR"
      expected_annual: "100000"
      expected_text: "EUR 100,000 gross per year"
      note: >-
        ESTIMATE — senior MLE Berlin ~EUR 75-95k, Munich ~EUR 85-105k; the ask is set at
        the top of the German band (Sunil, 2026-09-29). Clears the
        EU Blue Card IT-shortage floor (~EUR 43,760) roughly twice over. German
        offers quote gross annual with no equity at most non-startups; ask
        whether the number includes the 13th-month payment before comparing.
    luxembourg:
      currency: "EUR"
      expected_annual: "115000"
      expected_text: "EUR 115,000 gross per year"
      note: >-
        ESTIMATE — senior MLE Luxembourg ~EUR 85-115k; the ask is set at the top of that
        band (Sunil, 2026-09-29). Wages run above Germany
        because the finance sector sets the market. Two local specifics to check
        at offer: salaries are indexed to inflation and adjust automatically, and
        most contracts state 13 monthly payments — so confirm whether a quoted
        annual figure already includes the 13th month before comparing it to a
        German or Dutch offer.
    switzerland:
      currency: "CHF"
      expected_annual: "155000"
      expected_text: "CHF 155,000 gross per year"
      note: >-
        ESTIMATE — senior MLE Zurich ~CHF 135-180k; Google Zurich and the trading
        firms exceed it. Highest real take-home of any market here because tax is
        low, but Zurich costs are extreme, so compare net-of-rent. Do not lower
        this ask to seem easier to hire: a below-band salary can undermine the
        Permit B case, which requires showing local-market-rate pay.
    remote_india:
      currency: "USD"
      expected_annual: "120000"
      expected_text: "USD 120,000 per year, contracting from India via EOR"
      note: >-
        Fully-remote roles paid in foreign currency. Typically 40-60% below the
        onsite US band, but tax-efficient from India and no visa lag. Adjust up
        toward USD 150k for US-headquartered companies with global-rate policies.

