# ============================================================================
# answers.yaml — canonical answers for every job-application form field.
#
# Written ONCE, reused by autofill.py on every external portal (Greenhouse,
# Lever, Ashby, Workday). This file is the single source of truth: if a portal
# asks it, the answer belongs here, not in your head.
#
# Fields marked TODO must be filled by Sunil before autofill runs.
# Keep it truthful — same golden rule as the resume.
#
# STORED FACTS. Everything here is his profile: always true, and on every form it wins
# over anything kept from a card. No code ever writes this file: edit it by hand.
# A form whose list cannot hold a stored value (no IIT Jodhpur in its schools) gets a
# stand-in he approves, kept for that portal (applications/_tenants/) — never written here.
#
# NOT IN GIT-SAFE TERRITORY: contains personal data. Do not publish this file.
# ============================================================================

