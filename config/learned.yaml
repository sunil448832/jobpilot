- match: what did you own, what were you trying to improve, and what was the outcome? if you
    used an ai assistant, what was your experience, what are underappreciated be
  keywords:
  - did
  - own
  - were
  - trying
  - improve
  - was
  - outcome
  - used
  answer: 'I owned an evaluation service meant to replace manual QA on our agent fleet: 28
    graded tasks on real Kaggle datasets, a cell-level precision/recall/F1 grader (order-insensitive,
    float/date tolerant), and an LLM-based root-cause analyzer that separates genuine errors
    from acceptable variants. I used an AI assistant (Claude) heavily to draft the grading
    logic and iterate on edge cases in the tolerance rules. The underappreciated part was
    how much of the value was in the grader''s tolerance design, not the model calling it
    — a strict-equality grader made a good agent look bad, and a sloppy one hid real regressions.
    Outcome: the fleet benchmarked at 86% exact-pass, 0.86 mean F1, and every release now
    gets automated regression visibility instead of manual spot-checks.'
  source: answered by Sunil on the Deepjudge form, 2026-09-23
