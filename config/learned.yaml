- match: tell us about yourself
  keywords:
  - tell
  - about
  - yourself
  answer: 'I am a Senior Data Scientist at Aria Intelligent Solutions with about 5 years in
    production ML, previously an Applied Scientist at Amazon, with an M.Tech in AI from IIT
    Jodhpur. The work I am proudest of is the data-quality side: I built an evaluation service
    that runs 28 graded tasks on real Kaggle datasets against our agent fleet, with a cell-level
    precision/recall/F1 grader (order-insensitive, float and date tolerant) and an LLM root-cause
    analyzer that separates genuine errors from acceptable variants. It benchmarked the fleet
    at 86% exact-pass and 0.86 mean F1 and replaced manual QA with regression visibility on
    every release. Before that I built a pipeline that parsed millions of noisy scientific
    PDFs, and I root-caused and fixed a production write-time OOM in a Qdrant index while
    compressing it 8x with 4-bit quantization at nDCG/recall parity across 8 BEIR datasets.
    I do not come from a biology lab, but deciding whether a number is real or an artifact,
    and turning that judgment into automated checks, is what I do every day. I am open to
    relocating to Lausanne and would need a Swiss work permit.'
