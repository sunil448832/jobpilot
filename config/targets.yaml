    - "post-training"
    - "GRPO"
    - "RLVR"
    - "verifiable rewards"
    - "QLoRA"
    - "Qwen"
    - "model compression"

  # Promoted weekly by keyword_learn.py from applied JDs — hard skills the
  # base resume already evidences, in the market's wording. Scored by rank.py
  # at keywords_learn.learned_weight. Remove a line to un-learn it.
  learned:
    - "claude"   # learned 2026-W39, 18 JDs
    - "sql"   # learned 2026-W39, 14 JDs
    - "distributed systems"   # learned 2026-W39, 9 JDs

  # Ticked DONE by Sunil on the keyword page: work he has actually done that the
  # resume does not mention yet. Counts as TRUE (optimize.py includes it in the
  # truth vocabulary; rank.py scores it with the learned bucket). Each one is
  # also listed in data/resume_todo.md until it is written into the base resume.
  confirmed:
    - "experimentation"   # confirmed DONE 2026-09-23, 8 JDs — write it into the resume

seniority:
  target: ["Senior", "Mid-Senior", "L4", "L5", "IC3", "IC4"]
  # 5 yrs of experience. Roles demanding 8+ score low but are not auto-rejected —
  # JD year requirements are frequently aspirational.
  max_years_required_soft_cap: 8
  avoid: ["Intern", "Graduate", "Junior", "Principal", "Staff", "Director", "Head of"]

routing:
  # Mirrors answers.yaml:portal_routing. Phone-friendly portals reach Telegram;
  # Workday-class ones batch for desktop. See automation-plan.md §1.
  mobile_ok: ["greenhouse", "lever", "ashby"]
  desktop_only: ["workday", "taleo", "icims", "successfactors"]
  manual: ["linkedin", "wellfound", "instahyre"]

scoring:
  # Points by market priority. Widened 2026-09-05: US postings state the highest
  # salaries and were collecting the pay boost every time, pushing them to the top
  # of a list ranked for someone the H-1B lottery mostly gates out. A salary you
  # cannot access is worth little, so sponsorship reality now outweighs headline pay.
  # Points are keyed on the market's `priority` above, so adding a market needs
  # no change here — only an honest priority. Ranked by how often sponsorship
  # actually happens, never by headline pay.
  market_bonus:
    1: 22        # Netherlands, Ireland, Germany, Luxembourg, remote-from-India
                 #   — no labour-market test, no lottery, weeks not months
    2: 18        # UAE, Saudi
                 #   — routine: nearly every hire there is an expat
    3: 12        # Australia, Switzerland
                 #   — real but rationed: approved-sponsor list / Permit B quota
    4: 2         # USA — H-1B lottery gates most of it regardless of fit

  # Calibrated 2026-09-05 against 8,804 real postings (183 matches):
  #   >=60: 5    >=55: 25    >=50: 39    top score 63.0
  # The original 65/80 guesses queued nothing at all.
  min_score_to_queue: 50        # below this, do not build a resume
  auto_queue_above: 60          # above this, tailor and fill without asking
  boost:
    sponsorship_explicit: 15    # JD explicitly says it sponsors
    fully_remote_global: 12
    genai_agentic_focus: 10
    referral_available: 20      # referrals.py found a connection there
    pay_above_ask: 12           # posted pay converts to at or above the ask
    # Y Combinator company. Set to +5 on 2026-09-07, level with preferred_companies:
    # every YC match so far has been US-based (where early-stage firms rarely
    # sponsor), so this is a tiebreaker rather than a driver. Its real value is the
    # remote-from-India subset.
    yc_startup: 5

  # Company scale. Larger employers matter for a specific reason, not prestige:
  # they have immigration counsel, sponsorship budget and an existing visa
  # process. A 15-person startup usually cannot sponsor at all, whatever it says.
  # Signal is open-req count (median across boards is 12) or YC headcount.
  # NOTE this partly opposes yc_startup above — deliberately. A big company wins
  # on sponsorship reality, a YC startup on remote-hiring willingness.
  company_scale:
    enterprise: 10        # 400+ open reqs, or 1000+ staff
    large: 7              # 150-400 reqs, or 250-1000 staff
    mid: 4                # 40-150 reqs, or 60-250 staff
    small: 0              # below that
  # Employers worth extra weight regardless of size — edit freely. Deliberately
  # ADDITIVE with company_scale: scale answers "can they sponsor", preferred
  # answers "do you want to work there". Kept at 5 so the two together (+15 max)
  # cannot outrun the market weighting, which reflects who can actually hire him.
  preferred_companies: 5
  preferred_list:
    - OpenAI
    - Anthropic
    - Databricks
    - Google DeepMind
    - Cohere
    - Hugging Face
    - Scale AI
    - TII
    - G42
    - MBZUAI
    - Adyen
    - Booking
    - ASML
    - Philips
    - Canva
    - Atlassian
    - Stripe
    - Snowflake
    - Elastic
    - NVIDIA
  penalty:
    years_required_over_8: -10
    pay_below_ask: -12          # posted pay converts to clearly under the ask
    no_sponsorship_language: -100   # effectively a reject
