    - "Python"
    - "PyTorch"
    - "Machine Learning"
    - "Deep Learning"
    - "Computer Vision"
    - "NLP"
    - "AWS"
    - "Production ML"
    # Backend + infra, added 2026-09-06. All evidenced in resume/sections or
    # project-memory-backup. Frontend is explicitly excluded — see titles.avoid.
    - "FastAPI"
    - "Redis"
    - "PostgreSQL"
    - "database"
    - "data pipeline"
    - "Docker"
    - "Kubernetes"
    - "CI/CD"
    - "cloud infrastructure"
    - "Terraform"
    - "sandboxing"
  strong_recent:                # 3 yrs — the differentiator right now
    - "Generative AI"
    - "Large Language Models"
    - "LLM"
    - "Agentic AI"
    - "Multi-Agent Systems"
    - "RAG"
    - "Vector Database"
    - "vLLM"
    - "LLM Inference Optimization"
    - "Model Evaluation"
    - "Guardrails"
    - "Prompt Injection"
    - "Quantization"
    # Added from project-memory-backup — all true, none previously matched on.
    - "Qdrant"
    - "hybrid retrieval"
    - "BM25"
    - "semantic search"
    - "reranking"
    - "LoRA"
    - "fine-tuning"
    - "DeepSpeed"
    - "distributed training"
    - "Text2SQL"
    - "vision language model"
    - "document AI"
    - "multilingual"
    - "observability"
    # "customer-facing": confirmed by Sunil 2026-09-06.
    # RL post-training: on the resume since 2026-09-22 (GRPO + verifiable rewards
