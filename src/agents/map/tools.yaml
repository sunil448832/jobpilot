# The MAP step of exploration (apply/explore/mapper.py): one page's controls (each with
# an id), its snapshot, the applicant's facts, the page's placeholders and LAST ACT in;
# [id, write|select, answer] per control out. One turn, no tools — everything it needs
# is in the prompt.
llm: map
max_turns: 1
timeout: 300
allowed_tools: []
tools: none          # one turn, answer only: no tool is offered (a tool call ends the turn empty)
params: [step, snapshot, todo, facts, placeholders, last_act]
